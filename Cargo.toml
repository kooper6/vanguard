[workspace]
members = [
    "crates/agent_vcs_core",
    "crates/agent_vcs_mcp",
    "crates/agent_vcs_cli",
]
resolver = "2"

[workspace.dependencies]
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
git2 = "0.19"
rocksdb = "0.22"
rmp-serde = "1.3"
sha2 = "0.10"
tower-lsp = "0.20"
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.27"
ratatui = "0.26"
similar = "2.4"
tempfile = "3.10"
